<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Finance Pro
  </title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

  <div class="logo">

    Finance Pro

  </div>


  <ul class="nav-links">

    <li>
      <a href="#"
         id="nav1">

        Inicio

      </a>
    </li>

    <li>
      <a href="#prestamos"
         id="nav2">

        Préstamos

      </a>
    </li>

    <li>
      <a href="#investment"
         id="nav3">

        VAN / TIR

      </a>
    </li>

    <li>
      <a href="#margenes"
         id="nav4">

        Márgenes

      </a>
    </li>

    <li>
      <a href="#contacto"
         id="nav5">

        Contacto

      </a>
    </li>

  </ul>


  <div class="nav-right">

    <input type="text"
           id="searchInput"
           placeholder="Buscar...">


    <button onclick="searchSection()"
            class="search-btn">

      🔍

    </button>


    <button onclick="toggleDarkMode()"
            class="dark-btn">

      🌙

    </button>


    <div class="languages">

      <button onclick="changeLanguage('es')">

        ES

      </button>

      <button onclick="changeLanguage('en')">

        EN

      </button>

      <button onclick="changeLanguage('fr')">

        FR

      </button>

      <button onclick="changeLanguage('ar')">

        AR

      </button>

    </div>

  </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="hero-overlay">

    <h1 id="hero-title">

      Plataforma Financiera Inteligente

    </h1>


    <p id="hero-text">

      Calcula préstamos, compara bancos y analiza inversiones.

    </p>


    <button id="hero-btn">

      Comenzar

    </button>

  </div>

</section>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="script.js"></script>

</body>
</html>
